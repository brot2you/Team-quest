<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#8fe6ff">
<title>TEAM QUEST — Build better together! · BROT2YOU</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Nunito:wght@600;700;800;900&display=swap" rel="stylesheet">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 48 48'%3E%3Cpath d='M6 36 10 14 18 24 24 10 30 24 38 14 42 36Z' fill='%23ffc928' stroke='%2317306b' stroke-width='3' stroke-linejoin='round'/%3E%3C/svg%3E">
<style>
:root{
  --ink:#17306b;--ink2:#2a4a92;--sky:#8fe6ff;--paper:#fffdf6;--sun:#ffc928;--line:#c9dcf3;
  --leader:#2fbf4a;--secretary:#1e9bea;--speaker:#ff8a1f;--time:#8b5cf6;--language:#f03c9a;--player:#13b5b0;
  --signal:#e5262f;--stuck:#f5a300;--awards:#e8a400;
  --r:22px;--shadow:0 6px 0 var(--ink);
  --display:'Lilita One','Arial Rounded MT Bold','Trebuchet MS',sans-serif;
  --body:'Nunito','Trebuchet MS','Segoe UI',system-ui,sans-serif;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;font-family:var(--body);font-weight:700;color:var(--ink);min-height:100vh;
  background:
   radial-gradient(circle at 12% 18%,rgba(255,255,255,.9) 0 2px,transparent 3px),
   radial-gradient(circle at 70% 60%,rgba(255,240,150,.9) 0 2px,transparent 3px),
   linear-gradient(165deg,#8fe6ff 0%,#d9f6ff 42%,#fff4c9 100%);
  background-size:70px 70px,110px 110px,100% 100%;background-attachment:fixed}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:4px solid var(--sun);outline-offset:3px}
img{max-width:100%;display:block}
.hidden{display:none!important}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.wrap{max-width:1180px;margin:0 auto;padding:14px 16px 40px}
.ico{width:1em;height:1em;flex:none}

/* ---------- top bar ---------- */
.top{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:inherit;background:none;border:0;padding:0}
.brand-mark{font-family:var(--display);font-size:clamp(26px,4vw,38px);line-height:.9;letter-spacing:.5px;color:var(--sun);
  -webkit-text-stroke:2px var(--ink);paint-order:stroke fill;text-shadow:0 4px 0 var(--ink)}
.brand-mark b{font-weight:400;color:#29a8ff}
.brand small{display:block;font-family:var(--body);font-size:12px;font-weight:800;color:var(--ink2);margin-top:4px;-webkit-text-stroke:0;text-shadow:none}
.top-right{margin-left:auto;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.chip-team{display:flex;align-items:center;gap:8px;background:#fff;border:3px solid var(--ink);border-radius:999px;padding:6px 14px 6px 8px;box-shadow:0 4px 0 var(--ink);font-weight:900;max-width:260px}
.chip-team span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chip-team .ico{font-size:22px}
.timer-chip{display:flex;align-items:center;gap:6px;background:var(--time);color:#fff;border:3px solid var(--ink);border-radius:999px;padding:6px 12px;box-shadow:0 4px 0 var(--ink);font-weight:900;font-variant-numeric:tabular-nums}
.iconbtn{color:var(--ink);width:46px;height:46px;display:grid;place-items:center;background:#fff;border:3px solid var(--ink);border-radius:14px;box-shadow:0 4px 0 var(--ink);font-size:22px;padding:0}
.iconbtn:active,.btn:active,.chip-team:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}

/* ---------- buttons ---------- */
.btn{color:var(--ink);display:inline-flex;align-items:center;justify-content:center;gap:8px;border:3px solid var(--ink);border-radius:14px;padding:10px 16px;
  background:#fff;box-shadow:0 4px 0 var(--ink);font-weight:900;font-size:16px;line-height:1.1;min-height:46px;text-align:center}
.btn .ico{font-size:20px}
.btn.big{font-size:19px;padding:14px 22px;border-radius:18px}
.btn.go{background:linear-gradient(#8cf07a,#22b14c);color:#fff;text-shadow:0 2px 0 rgba(0,0,0,.25)}
.btn.sun{background:linear-gradient(#fff3a0,#ffc928)}
.btn.blue{background:linear-gradient(#b9ecff,#3aaeff);color:#08306b}
.btn.pink{background:linear-gradient(#ffd0ea,#ff6fb8)}
.btn.red{background:linear-gradient(#ff9a9a,#e5262f);color:#fff}
.btn.ghost{background:transparent;box-shadow:none;border-style:dashed}
.btn.small{min-height:36px;padding:6px 10px;font-size:14px;border-radius:11px;box-shadow:0 3px 0 var(--ink)}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.row.end{justify-content:flex-end}
.spacer{flex:1}

/* ---------- panels ---------- */
.panel{background:var(--paper);border:4px solid var(--ink);border-radius:var(--r);box-shadow:var(--shadow);margin-bottom:22px;overflow:hidden}
.band{display:flex;align-items:center;gap:14px;padding:12px 18px;background:var(--c,var(--ink2));color:#fff;position:relative}
.band::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(255,255,255,.28),transparent 55%);pointer-events:none}
.band h2,.band h1{margin:0;font-family:var(--display);font-weight:400;font-size:clamp(24px,3.4vw,36px);line-height:1;letter-spacing:.3px;
  -webkit-text-stroke:1.5px var(--ink);paint-order:stroke fill;text-shadow:0 3px 0 var(--ink)}
.band p{margin:3px 0 0;font-size:14px;font-weight:800;color:#fff;opacity:.95}
.band .coin{flex:none}
.band .back{margin-left:auto;position:relative;z-index:1}
.body{padding:18px}
.sec{margin:0 0 18px}
.sec:last-child{margin-bottom:0}
.sec-title{display:flex;align-items:center;gap:10px;margin:0 0 10px;font-family:var(--display);font-weight:400;font-size:22px;color:var(--ink)}
.num{display:inline-grid;place-items:center;width:34px;height:34px;border-radius:50%;border:3px solid var(--ink);background:#fff;font-family:var(--display);font-size:17px;flex:none}
.fr{display:block;font-family:var(--body);font-size:13px;font-weight:700;color:#4b6294}
.sec-title .fr{font-size:13px;margin-top:1px}
.box{border:3px solid var(--c,var(--ink2));background:var(--soft,#eef6ff);border-radius:18px;padding:14px}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
.hint{font-size:14px;color:#46608f;margin:0 0 10px}
.empty{padding:18px;border:3px dashed var(--line);border-radius:16px;text-align:center;color:#46608f}

/* ---------- fields ---------- */
.field{display:block;margin-bottom:12px}
.field>span{display:block;margin-bottom:5px;font-weight:900}
.field>span .fr{display:inline;margin-left:6px}
input[type=text],input[type=number],textarea,select{width:100%;border:3px solid #9cc1ea;border-radius:13px;background:#fff;padding:10px 12px;min-height:46px;font-weight:700;color:#14305e}
textarea{min-height:92px;resize:vertical;line-height:1.4}
input:focus,textarea:focus,select:focus{border-color:var(--ink2);outline:none;box-shadow:0 0 0 4px rgba(255,201,40,.6)}
.lined{background:repeating-linear-gradient(#fff,#fff 29px,#d7e6f7 30px);line-height:30px;padding-top:6px}
.check{display:flex;align-items:flex-start;gap:12px;padding:10px 12px;border:2px solid var(--line);border-radius:14px;background:#fff;margin:7px 0;cursor:pointer}
.check input{position:absolute;opacity:0;width:1px;height:1px}
.check .tick{width:28px;height:28px;border:3px solid var(--ink);border-radius:8px;background:#fff;flex:none;display:grid;place-items:center;color:transparent;font-size:18px;transition:background .15s}
.check input:checked+.tick{background:var(--leader);color:#fff}
.check input:focus-visible+.tick{outline:4px solid var(--sun);outline-offset:2px}
.check.mini{margin:0;padding:4px;border:0;background:none;justify-content:center}
.check.done{background:#effbef;border-color:#9fe3a8}
.check .t{flex:1}
.progress{height:20px;border:3px solid var(--ink);border-radius:12px;background:#e6eeff;overflow:hidden}
.progress>i{display:block;height:100%;background:repeating-linear-gradient(45deg,#3ad46a 0 12px,#2fbf4a 12px 24px);transition:width .3s}

table.sheet{width:100%;border-collapse:separate;border-spacing:0;border:3px solid var(--c,var(--ink2));border-radius:14px;overflow:hidden;background:#fff}
table.sheet th{background:var(--soft,#eef6ff);text-align:left;padding:8px 10px;font-size:14px;border-bottom:2px solid var(--c,var(--ink2))}
table.sheet th .fr{font-size:12px}
table.sheet td{padding:6px;border-top:2px solid #e3ecf8;vertical-align:middle}
table.sheet td input[type=text]{border-width:2px;min-height:40px}
table.sheet .narrow{width:96px}
table.sheet .tickcol{width:64px;text-align:center}

/* ---------- coins (role emblems) ---------- */
.coin{width:var(--s,64px);height:var(--s,64px);border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff 0 18%,var(--soft,#fff) 19% 100%);border:4px solid var(--ink);display:grid;place-items:center;box-shadow:0 4px 0 var(--ink);position:relative}
.coin::before{content:"";position:absolute;inset:4px;border-radius:50%;border:3px solid var(--c);opacity:.9}
.coin svg{width:66%;height:66%}

/* ---------- hub ---------- */
.hero{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,.75fr);gap:18px;align-items:center;padding:20px;background:
  radial-gradient(circle at 85% 20%,rgba(255,255,255,.75),transparent 40%),linear-gradient(135deg,#bdf1ff,#fff7c4 60%,#ffd6ee)}
.team-title{margin:0;font-family:var(--display);font-weight:400;font-size:clamp(36px,6vw,64px);line-height:.98;color:var(--sun);
  -webkit-text-stroke:2.5px var(--ink);paint-order:stroke fill;text-shadow:0 5px 0 var(--ink);word-break:break-word}
.mission-line{display:flex;gap:10px;align-items:flex-start;margin:14px 0;font-size:clamp(17px,2.2vw,21px);font-weight:900;background:#fff;border:3px solid var(--ink);border-radius:16px;padding:10px 14px}
.mission-line .ico{font-size:28px;margin-top:-2px}
.hero-art{position:relative}
.hero-art img{border:4px solid var(--ink);border-radius:20px;box-shadow:var(--shadow);width:100%;aspect-ratio:4/3;object-fit:cover;background:#fff}
.hero-art .bubble{position:absolute;left:-10px;bottom:-12px;background:#fff;border:3px solid var(--ink);border-radius:16px;padding:8px 12px;font-weight:900;box-shadow:0 4px 0 var(--ink);max-width:85%}
.quick-signal{display:flex;gap:8px;flex-wrap:wrap}
.qs{color:var(--ink);display:flex;align-items:center;gap:8px;border:3px solid var(--ink);border-radius:14px;padding:8px 12px;font-weight:900;background:#fff;box-shadow:0 4px 0 var(--ink);min-height:46px}
.qs i{width:18px;height:18px;border-radius:50%;border:2px solid var(--ink);background:var(--c)}
.qs.on{background:var(--c);color:#fff;text-shadow:0 1px 0 rgba(0,0,0,.3)}
.qs.on i{background:#fff}

.roles-grid{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:12px}
.role-card{display:flex;flex-direction:column;align-items:center;text-align:center;gap:6px;padding:14px 8px 12px;border:4px solid var(--ink);border-radius:20px;
  background:linear-gradient(180deg,#fff 0 35%,var(--soft) 100%);box-shadow:var(--shadow);cursor:pointer;position:relative;overflow:hidden}
.role-card::before{content:"";position:absolute;left:0;right:0;top:0;height:8px;background:var(--c)}
.role-card h3{margin:2px 0 0;font-family:var(--display);font-weight:400;font-size:clamp(16px,1.7vw,20px);line-height:1.05}
.role-card .fr{font-size:12px}
.names{display:flex;flex-wrap:wrap;justify-content:center;gap:4px;min-height:28px}
.name{background:var(--c);color:#fff;border:2px solid var(--ink);border-radius:999px;padding:2px 9px;font-size:13px;font-weight:900}
.name.none{background:#fff;color:#7d8fb5;border-style:dashed}

.tools-grid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px}
.tool{display:flex;flex-direction:column;align-items:flex-start;gap:6px;padding:14px;border:4px solid var(--ink);border-radius:18px;background:linear-gradient(160deg,#fff 30%,var(--soft));box-shadow:0 5px 0 var(--ink);text-align:left;min-height:132px}
.tool .ticon{width:48px;height:48px;border-radius:14px;background:var(--c);border:3px solid var(--ink);display:grid;place-items:center}
.tool .ticon svg{width:34px;height:34px}
.tool b{font-family:var(--display);font-weight:400;font-size:19px;line-height:1.05}
.tool .fr{font-size:12px}
.tool:active,.role-card:active{transform:translateY(3px);box-shadow:0 2px 0 var(--ink)}

/* ---------- teams launcher ---------- */
.teams{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.team-card{border:4px solid var(--ink);border-radius:20px;background:#fff;box-shadow:var(--shadow);padding:16px;display:flex;flex-direction:column;gap:8px}
.team-card h3{margin:0;font-family:var(--display);font-weight:400;font-size:26px;line-height:1}
.team-card.current{background:linear-gradient(160deg,#fff,#fff6c8)}
.intro{display:grid;grid-template-columns:minmax(0,1fr) 260px;gap:20px;align-items:center}
.intro h1{font-family:var(--display);font-weight:400;font-size:clamp(34px,5vw,54px);line-height:1;margin:0 0 10px;color:var(--sun);-webkit-text-stroke:2px var(--ink);paint-order:stroke fill;text-shadow:0 4px 0 var(--ink)}
.intro p{font-size:18px;margin:0 0 8px}
.intro img{border:4px solid var(--ink);border-radius:20px;box-shadow:var(--shadow);background:#fff}

/* ---------- roles setup ---------- */
.member-row{display:grid;grid-template-columns:minmax(120px,200px) 1fr auto;gap:10px;align-items:center;padding:10px;border:2px solid var(--line);border-radius:16px;background:#fff;margin-bottom:8px}
.role-toggles{display:flex;flex-wrap:wrap;gap:6px}
.rt{display:flex;align-items:center;gap:6px;border:2.5px solid var(--ink);border-radius:999px;padding:4px 10px 4px 4px;background:#fff;font-size:14px;font-weight:900}
.rt .mini{width:26px;height:26px;border-radius:50%;background:var(--soft);border:2px solid var(--c);display:grid;place-items:center}
.rt .mini svg{width:18px;height:18px}
.rt.on{background:var(--c);color:#fff}
.rt.on .mini{background:#fff}
.warn{background:#fff6d6;border:3px solid #f5b400;border-radius:14px;padding:10px 14px;margin:10px 0;font-weight:800}

/* ---------- role page ---------- */
.role-hero{display:grid;grid-template-columns:auto 1fr;gap:18px;align-items:center}
.motto{font-size:clamp(19px,2.4vw,24px);font-weight:900;margin:0}
.phrase{display:flex;align-items:center;gap:10px;border:2px solid var(--line);background:#fff;border-radius:14px;padding:8px 10px;margin:7px 0}
.phrase .say{flex:1;min-width:0}
.phrase .say strong{display:block;font-size:17px;font-weight:900}
.phrase .say .fr{font-size:13px}
.phrase .fr[hidden]{display:none}
.play{width:42px;height:42px;border-radius:50%;border:3px solid var(--ink);background:linear-gradient(#b9ecff,#3aaeff);display:grid;place-items:center;flex:none;box-shadow:0 3px 0 var(--ink);padding:0}
.play svg{width:20px;height:20px}
.frbtn{border:2px solid var(--ink);border-radius:10px;background:#fff;font-size:12px;font-weight:900;padding:6px 8px;flex:none}
.frbtn[aria-pressed=true]{background:var(--sun)}

/* ---------- phrases ---------- */
.tabs{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
.tab{border:3px solid var(--ink);border-radius:999px;padding:8px 14px;background:#fff;font-weight:900;box-shadow:0 3px 0 var(--ink)}
.tab[aria-selected=true]{background:var(--language);color:#fff}
.cards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.tcard{border:4px solid var(--ink);border-radius:20px;background:#fff;overflow:hidden;box-shadow:0 5px 0 var(--ink);display:flex;flex-direction:column;padding:0;text-align:center}
.tcard .q{padding:12px 10px;font-family:var(--display);font-weight:400;font-size:clamp(17px,2vw,22px);line-height:1.1;min-height:64px;display:grid;place-items:center}
.tcard img{width:100%;aspect-ratio:315/185;object-fit:cover;border-top:3px solid var(--ink);border-bottom:3px solid var(--ink)}
.tcard .a{padding:8px 10px;font-size:14px;color:#3d5688;min-height:44px;display:grid;place-items:center}
.alpha{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:8px}
.letter{border:3px solid var(--c);border-radius:14px;background:var(--soft);padding:8px 4px;text-align:center;font-family:var(--display);font-weight:400;font-size:clamp(22px,3vw,32px);line-height:1}
.letter small{display:block;font-family:var(--body);font-size:14px;font-weight:800;margin-top:4px;color:#33497a}
.strategy{display:flex;align-items:center;flex-wrap:wrap;gap:10px;background:#f3eaff;border:3px solid var(--time);border-radius:16px;padding:10px 14px;margin-top:14px}
.strategy b{font-family:var(--display);font-weight:400;font-size:18px}

/* ---------- timer ---------- */
.phases{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.phase{border:3px solid var(--ink);border-radius:16px;background:var(--soft);padding:10px;text-align:left;position:relative}
.phase.on{outline:5px solid var(--sun);outline-offset:2px}
.phase.done{opacity:.6}
.phase b{font-family:var(--display);font-weight:400;font-size:20px;display:block}
.phase .mins{display:flex;align-items:center;gap:6px;margin-top:8px}
.phase .mins input{width:72px;min-height:38px;padding:6px;text-align:center;border-width:2px}
.phase .move{font-size:12px;color:#3e5585;margin-top:6px}
.clock-wrap{display:grid;grid-template-columns:minmax(0,1fr) 150px;gap:18px;align-items:stretch;margin:18px 0}
.clock{background:linear-gradient(#1c3f88,#0a1d4a);color:#fff;border:6px solid var(--ink);outline:6px solid var(--sun);border-radius:26px;padding:16px;text-align:center;box-shadow:0 10px 0 var(--ink)}
.clock .now{font-size:15px;opacity:.85}
.clock .digits{font-family:var(--display);font-size:clamp(70px,13vw,150px);line-height:1;letter-spacing:3px;font-variant-numeric:tabular-nums}
.clock .total{font-size:15px;opacity:.9}
.clock.warn .digits{color:#ffd23f}
.clock.alarm .digits{color:#ff6b6b}
.strip{display:flex;flex-direction:column;border:4px solid var(--ink);border-radius:18px;overflow:hidden;background:#fff}
.strip div{flex:1;display:flex;align-items:center;gap:8px;padding:0 10px;font-family:var(--display);font-size:18px;border-bottom:2px solid #e2e9f6;color:#fff;background:var(--c);opacity:.35;min-height:22px}
.strip div:last-child{border-bottom:0}
.strip div.on{opacity:1;outline:4px solid var(--sun);outline-offset:-4px}
.strip div.past{opacity:.12}
.budget{display:flex;align-items:center;flex-wrap:wrap;gap:8px;font-family:var(--display);font-size:22px}
.budget .cell{min-width:58px;padding:6px 10px;text-align:center;background:#fff;border:3px solid var(--ink);border-radius:12px}
.budget .ok{color:var(--leader)}
.budget .ko{color:var(--signal)}

/* ---------- wheel ---------- */
.wheel-zone{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:20px;align-items:center}
.wheel-box{position:relative;max-width:420px;width:100%;margin:0 auto;aspect-ratio:1}
.wheel-box svg.w{width:100%;height:100%;transition:transform 3.4s cubic-bezier(.17,.84,.24,1)}
.wheel-pointer{position:absolute;left:50%;top:-6px;transform:translateX(-50%);width:44px;height:52px;z-index:2}
.wheel-hub{position:absolute;left:50%;top:50%;width:30%;height:30%;transform:translate(-50%,-50%);border-radius:50%;border:5px solid var(--ink);background:linear-gradient(#fff6a8,#ffc928);font-family:var(--display);font-size:clamp(18px,3vw,26px);box-shadow:0 5px 0 var(--ink);z-index:2;padding:0}
.turn{background:#fff;border:4px solid var(--ink);border-radius:22px;padding:18px;box-shadow:var(--shadow);text-align:center}
.turn .who{font-family:var(--display);font-size:clamp(32px,5vw,54px);line-height:1;color:var(--language);-webkit-text-stroke:1.5px var(--ink);paint-order:stroke fill;margin:6px 0}
.seg-modes{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;margin:12px 0}
.counts{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin-top:10px}
.counts span{border:2px solid var(--line);border-radius:999px;padding:2px 10px;background:#fff;font-size:13px}

/* ---------- signal ---------- */
.faces{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.face{border:4px solid var(--ink);border-radius:20px;overflow:hidden;background:linear-gradient(135deg,var(--bg2),var(--bg));color:#fff;box-shadow:0 5px 0 var(--ink);padding:0;text-align:left;display:flex;flex-direction:column}
.face img{width:100%;aspect-ratio:4/3;object-fit:cover;object-position:top}
.face .ft{padding:10px 12px;font-family:var(--display);font-size:clamp(18px,2.2vw,24px);line-height:1.05;-webkit-text-stroke:1px var(--ink);paint-order:stroke fill;text-shadow:0 2px 0 var(--ink)}
.face .ff{display:block;font-family:var(--body);-webkit-text-stroke:0;text-shadow:none;font-size:13px;margin-top:4px}
.face.on{outline:6px solid var(--sun);outline-offset:3px}
.face:not(.on){filter:saturate(.7)}

.full{position:fixed;inset:0;z-index:60;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2vh;padding:4vh 4vw;
  background:radial-gradient(circle at 70% 30%,var(--bg2),var(--bg) 70%);color:#fff;text-align:center;cursor:pointer}
.full img{height:46vh;width:auto;max-width:90vw;border:6px solid #fff;border-radius:28px;box-shadow:0 10px 0 rgba(0,0,0,.25);object-fit:cover}
.full h2{margin:0;font-family:var(--display);font-weight:400;font-size:clamp(40px,8vw,110px);line-height:1;-webkit-text-stroke:3px var(--ink);paint-order:stroke fill;text-shadow:0 6px 0 var(--ink)}
.full p{margin:0;font-size:clamp(18px,2.6vw,30px);font-weight:900}
.full .tag{background:#fff;color:var(--bg);border:4px solid var(--ink);border-radius:16px;padding:4px 18px;font-family:var(--display);font-size:clamp(22px,3vw,36px)}
.full .close{position:absolute;top:14px;right:14px}
.full .hintline{position:absolute;bottom:14px;left:0;right:0;font-size:14px;opacity:.85}

/* ---------- ladder ---------- */
.ladder{display:flex;flex-direction:column-reverse;gap:10px;position:relative;padding-left:34px}
.ladder::before{content:"";position:absolute;left:8px;top:6px;bottom:6px;width:12px;border-radius:8px;background:linear-gradient(0deg,#2fbf4a,#f5a300 50%,#e5262f);border:3px solid var(--ink)}
.rung{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;border:3px solid var(--c);background:var(--soft);border-radius:18px;padding:12px}
.rung .n{width:46px;height:46px;border-radius:50%;background:var(--c);color:#fff;font-family:var(--display);font-size:26px;display:grid;place-items:center;border:3px solid var(--ink)}
.rung h3{margin:0;font-family:var(--display);font-weight:400;font-size:22px}
.rung .say{margin-top:6px;color:var(--c);font-weight:900}
.rung.done{box-shadow:inset 0 0 0 3px #fff}
.rung .tick-btn{width:46px;height:46px;border:3px solid var(--ink);border-radius:12px;background:#fff;font-size:24px;display:grid;place-items:center;padding:0}
.rung.done .tick-btn{background:var(--leader);color:#fff}
.start{font-family:var(--display);font-size:22px;color:var(--leader);margin:8px 0 0 34px}

/* ---------- awards ---------- */
.badges{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px}
.badge{display:flex;flex-direction:column;align-items:center;gap:8px;background:none;border:0;padding:6px;position:relative}
.badge img{width:min(100%,190px);aspect-ratio:1;filter:drop-shadow(0 5px 0 var(--ink))}
.badge .count{position:absolute;top:2px;right:12%;background:var(--signal);color:#fff;border:3px solid var(--ink);border-radius:999px;min-width:44px;height:44px;display:grid;place-items:center;font-family:var(--display);font-size:22px;padding:0 8px}
.badge.zero img{filter:grayscale(.85) opacity(.55) drop-shadow(0 5px 0 rgba(23,48,107,.4))}
.badge .lbl{font-weight:900}
.celebrate{position:fixed;inset:0;z-index:70;display:grid;place-items:center;background:rgba(9,30,78,.72);cursor:pointer}
.celebrate .in{text-align:center;color:#fff}
.celebrate img{width:min(62vw,380px);margin:0 auto;animation:pop .6s cubic-bezier(.2,1.6,.4,1) both;filter:drop-shadow(0 10px 0 rgba(0,0,0,.35))}
.celebrate h2{font-family:var(--display);font-weight:400;font-size:clamp(30px,6vw,58px);margin:14px 0 0;color:var(--sun);-webkit-text-stroke:2px var(--ink);paint-order:stroke fill;text-shadow:0 4px 0 var(--ink)}
.confetti{position:fixed;inset:0;pointer-events:none;z-index:71;overflow:hidden}
.confetti i{position:absolute;top:-20px;width:12px;height:18px;border-radius:3px;animation:fall 2.2s linear forwards}
@keyframes pop{from{transform:scale(.2) rotate(-25deg);opacity:0}to{transform:none;opacity:1}}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}

/* ---------- announcement ---------- */
.announce{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);z-index:65;width:min(560px,94vw);background:#fff;border:4px solid var(--ink);border-radius:22px;box-shadow:0 8px 0 var(--ink);overflow:hidden;display:grid;grid-template-columns:150px 1fr;align-items:center;animation:slideup .35s ease-out both}
.announce.at-top{top:18px;bottom:auto}
.announce img{width:100%;height:100%;object-fit:cover}
.announce .tx{padding:12px 14px}
.announce b{display:block;font-family:var(--display);font-weight:400;font-size:24px;line-height:1.05}
@keyframes slideup{from{transform:translate(-50%,40px);opacity:0}to{transform:translate(-50%,0);opacity:1}}

/* ---------- modal / toast ---------- */
.modal-shade{position:fixed;inset:0;z-index:80;background:rgba(9,30,78,.6);display:grid;place-items:center;padding:16px}
.modal{width:min(480px,100%);background:var(--paper);border:4px solid var(--ink);border-radius:22px;box-shadow:0 10px 0 var(--ink);padding:20px}
.modal h3{margin:0 0 8px;font-family:var(--display);font-weight:400;font-size:28px}
.keypad{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 0}
.keypad button{min-height:56px;font-family:var(--display);font-size:26px;border:3px solid var(--ink);border-radius:14px;background:#fff;box-shadow:0 3px 0 var(--ink)}
.pin{display:flex;gap:10px;justify-content:center;margin:8px 0}
.pin i{width:22px;height:22px;border-radius:50%;border:3px solid var(--ink);background:#fff}
.pin i.on{background:var(--ink)}
.toast{position:fixed;left:50%;top:16px;transform:translateX(-50%);z-index:90;background:var(--ink);color:#fff;padding:12px 18px;border-radius:14px;font-weight:900;box-shadow:0 5px 0 rgba(0,0,0,.25);max-width:92vw;text-align:center}

/* ---------- present mode ---------- */
.present{position:fixed;inset:0;z-index:60;background:linear-gradient(160deg,#ffb35c,#ff8a1f);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:5vh 5vw;text-align:center;color:var(--ink)}
.present .card{background:#fff;border:6px solid var(--ink);border-radius:30px;box-shadow:0 12px 0 var(--ink);padding:4vh 4vw;width:min(1000px,100%)}
.present h2{font-family:var(--display);font-weight:400;font-size:clamp(28px,4.5vw,56px);margin:0 0 12px;color:var(--speaker);-webkit-text-stroke:2px var(--ink);paint-order:stroke fill}
.present .kw{font-size:clamp(26px,4vw,52px);font-weight:900;line-height:1.25;white-space:pre-wrap;word-break:break-word}
.present .starter{font-size:clamp(18px,2.4vw,28px);color:#4b6294;margin-bottom:10px}
.present .nav{display:flex;gap:12px;margin-top:3vh}

/* ---------- summary / print ---------- */
.sum h3{font-family:var(--display);font-weight:400;font-size:22px;margin:16px 0 6px;border-bottom:3px solid var(--ink)}
.sum p,.sum li{margin:4px 0;white-space:pre-wrap}
.sum table{border-collapse:collapse;width:100%}
.sum td,.sum th{border:2px solid #b8c9e6;padding:6px 8px;text-align:left;vertical-align:top}
.sum .badges-row{display:flex;gap:10px;flex-wrap:wrap}
.sum .badges-row div{display:flex;align-items:center;gap:6px}
.sum .badges-row img{width:48px}

footer{text-align:center;font-size:13px;color:#3f5a8d;margin-top:10px}

@media (max-width:980px){
  .roles-grid{grid-template-columns:repeat(3,minmax(0,1fr))}
  .tools-grid{grid-template-columns:repeat(3,minmax(0,1fr))}
}
@media (max-width:760px){
  .hero,.intro,.grid2,.wheel-zone,.clock-wrap{grid-template-columns:1fr}
  .grid3,.cards,.faces{grid-template-columns:repeat(2,minmax(0,1fr))}
  .phases{grid-template-columns:repeat(2,minmax(0,1fr))}
  .strip{flex-direction:row;height:60px}
  .strip div{justify-content:center;padding:0;font-size:15px;border-bottom:0;border-right:2px solid #e2e9f6}
  .strip div span{display:none}
  .alpha{grid-template-columns:repeat(5,minmax(0,1fr))}
  .member-row{grid-template-columns:1fr auto}
  .member-row .role-toggles{grid-column:1/-1}
  .announce{grid-template-columns:100px 1fr}
  .intro img{max-width:260px}
}
@media (max-width:480px){
  .wrap{padding:10px 10px 30px}
  .roles-grid,.tools-grid,.badges{grid-template-columns:repeat(2,minmax(0,1fr))}
  .cards,.faces,.grid3{grid-template-columns:1fr}
  .body{padding:14px}
  .brand small{display:none}
  .role-hero{grid-template-columns:1fr;justify-items:start}
  table.sheet .narrow{width:70px}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}
  .wheel-box svg.w{transition:none}
}
@media print{
  body{background:#fff}
  .top,.noprint,footer,.announce,.toast{display:none!important}
  .panel{box-shadow:none;border-width:2px}
  .wrap{max-width:none;padding:0}
  .band{-webkit-print-color-adjust:exact;print-color-adjust:exact}
}
#app:focus{outline:none}

  function stripHtml(r) {
    var cur = Math.min(10, Math.ceil(r / 60)), cols = ['#e5262f', '#ff7a12', '#f5b400', '#9bd43a', '#9bd43a', '#2fbf4a', '#2fbf4a', '#2fbf4a', '#24a640', '#24a640', '#1e8f37'];

  var tickHandle = null;
  function ensureTick() { if (!tickHandle) tickHandle = setInterval(tick, 400); }
  function tick() {
    var t = T();

    var r = remaining(t), tm = t.time;
    var d = document.getElementById('clock-digits'); if (d) d.textContent = mmss(r);
    var tot = document.getElementById('clock-total'); if (tot) tot.textContent = 'Total left · Temps total restant : ' + mmss(totalLeft(t));
    var st = document.getElementById('strip'); if (st) st.innerHTML = stripHtml(r);
    var cl = document.getElementById('clock'); if (cl) cl.className = 'clock' + (r <= 60 ? ' alarm' : r <= 120 ? ' warn' : '');
    var chip = document.getElementById('chip-time'); if (chip) chip.textContent = mmss(r);
    for (var k = 0; k < DATA.announce.length; k++) {
      var a = DATA.announce[k];
      if (!tm.said[a.s] && r <= a.s) { tm.said[a.s] = true; announce(a); save(); break; }
    }
    if (r <= 0) {
      tm.running = false; tm.left = 0; save(true); wake(false);
      fx('alarm');
      render();
    }
  }

    for (var k = 0; k < list.length; k++) {
      var t = normalizeTeam(list[k]);
      for (var j = 0; j < store.teams.length; j++) if (store.teams[j].id === t.id) { t.id = uid(); break; }
      t.time.running = false;
      store.teams.push(t); if (!first) first = t;
    }
    store.current = first.id; save(true);
    toast(list.length + ' équipe(s) importée(s).'); go('hub');
  }

  var ACT = {
    go: function (arg) { go(arg); },
    say: function (arg) { speak(arg); },
    fr: function (arg, el) { var row = el.closest('.phrase'), f = row && row.querySelector('.fr'); if (f) { f.hidden = !f.hidden; el.setAttribute('aria-pressed', String(!f.hidden)); } },
    closeLayer: function () { closeLayer(); },
    createTeam: function () {
      var name = document.getElementById('nt-name').value.trim();
      var mission = document.getElementById('nt-mission').value.trim();
      var total = Number(document.getElementById('nt-total').value) || 50;
      var names = document.getElementById('nt-members').value.split(/[\n,;]+/);
      if (!name) { toast('Donnez un nom à l’équipe.'); document.getElementById('nt-name').focus(); return; }
      var t = makeTeam(name, mission, names, total);
      store.teams.push(t); store.current = t.id; save(true);
      go(t.members.length ? 'roles' : 'roles');
    },
    openTeam: function (id) { store.current = id; save(true); go('hub'); },
    delTeam: function (id) {
      var t = null; for (var k = 0; k < store.teams.length; k++) if (store.teams[k].id === id) t = store.teams[k];
      if (!t) return;
      modal('Supprimer « ' + t.name + ' » ?', '<p>Tout le travail de cette équipe sera effacé de cet appareil. Pensez à l’exporter avant si besoin.</p>', [{ label: 'Annuler', act: 'closeLayer' }, { label: 'Supprimer', act: 'delTeamGo', arg: id, cls: 'red' }]);
    },
    delTeamGo: function (id) {
      store.teams = store.teams.filter(function (t) { return t.id !== id; });
      if (store.current === id) store.current = store.teams.length ? store.teams[0].id : null;
      save(true); closeLayer(); toast('Équipe supprimée.'); go(store.teams.length ? 'teams' : 'teams');
    },
    addMember: function () { var t = T(); if (t.members.length >= 8) return; var m = { id: uid(), name: 'Student ' + (t.members.length + 1) }; t.members.push(m); t.roles[m.id] = []; save(true); render(); var ins = app.querySelectorAll('.member-row input'); if (ins.length) { ins[ins.length - 1].focus(); ins[ins.length - 1].select(); } },
    delMember: function (id) { var t = T(); t.members = t.members.filter(function (m) { return m.id !== id; }); delete t.roles[id]; save(true); render(); },
    toggleRole: function (arg) {
      var p = arg.split('|'), t = T(), list = t.roles[p[0]] || (t.roles[p[0]] = []), idx = list.indexOf(p[1]);
      if (idx === -1) list.push(p[1]); else list.splice(idx, 1);
      save(true); render();
    },
    randomRoles: function () { randomRoles(T()); save(true); fx('tick'); render(); toast('Rôles tirés au sort !'); },
    rotateRoles: function () { rotateRoles(T()); save(true); fx('tick'); render(); toast('Rotation effectuée : chacun prend le rôle du précédent.'); },
    addStep: function () { var t = T(); if (t.mc.steps.length < 8) { t.mc.steps.push({ t: '', m: '', d: false }); save(true); render(); } },
    addRow: function () { var t = T(); if (t.notes.rows.length < 10) { t.notes.rows.push({ i: '', w: '' }); save(true); render(); } },
    copyToTalk: function () {
      var t = T(), n = t.notes, tk = t.talk, ev = [], k, changed = 0;
      for (k = 0; k < n.rows.length; k++) if (n.rows[k].w) ev.push(n.rows[k].w);
      if (!tk.answer && n.agreed) { tk.answer = n.agreed; changed++; }
      if (!tk.reasons && n.because) { tk.reasons = n.because; changed++; }
      if (!tk.evidence && ev.length) { tk.evidence = ev.join('\n'); changed++; }
      save(true);
      toast(changed ? 'Envoyé vers Team Talk (' + changed + ' partie' + (changed > 1 ? 's' : '') + ').' : 'Rien à envoyer : Team Talk est déjà rempli ou les notes sont vides.');
      if (changed) go('talk');
    },
    present: function () { ui.presentIdx = 0; openPresent(); },
    presentNav: function (arg) { if (arg === 'close') { closeLayer(); return; } ui.presentIdx = Math.max(0, Math.min(TALK.length - 1, ui.presentIdx + Number(arg))); openPresent(); },
    timerStart: function () {
      var t = T(), tm = t.time; if (tm.running) return;
      if (remaining(t) <= 0) return;
      tm.running = true; tm.endAt = Date.now() + tm.left * 1000; markSaid(t); save(true);
      ensureTick(); wake(true); fx('tick'); render(); tick();
    },
    timerPause: function () { var t = T(); t.time.left = remaining(t); t.time.running = false; save(true); wake(false); render(); },
    timerAdj: function (arg) {
      var t = T(), tm = t.time, r = Math.max(0, remaining(t) + Number(arg));
      if (tm.running) tm.endAt = Date.now() + r * 1000; else tm.left = r;
      tm.said = {}; for (var k = 0; k < DATA.announce.length; k++) if (DATA.announce[k].s > r) tm.said[DATA.announce[k].s] = true;
      save(true); render();
    },
    timerReset: function () { var t = T(); t.time.running = false; t.time.left = phaseLen(t, t.time.cur); t.time.said = {}; save(true); render(); },
    phaseSel: function (arg) { var t = T(); t.time.cur = Number(arg); t.time.running = false; t.time.left = phaseLen(t, t.time.cur); t.time.said = {}; save(true); render(); },
    phaseNext: function () {
      var t = T(), tm = t.time, was = tm.running; if (tm.cur >= 3) return;
      tm.cur++; tm.left = phaseLen(t, tm.cur); tm.said = {}; tm.running = false;
      if (was || remaining(t) >= 0) { /* keep the momentum: restart running if it was running */ }
      if (was) { tm.running = true; tm.endAt = Date.now() + tm.left * 1000; markSaid(t); ensureTick(); }
      save(true); render();
      if (store.settings.sound) speak('Let\'s move on.', true);
    },
    autoBudget: function () { var t = T(); t.time.phases = splitPhases(t.total); if (!t.time.running) t.time.left = phaseLen(t, t.time.cur); save(true); render(); },
    spin: function () { spin(); },
    wheelMode: function (arg) { T().wheel.mode = arg; save(true); render(); },
    wheelReset: function () { var w = T().wheel; w.counts = {}; w.last = -1; save(true); render(); },
    setSignal: function (arg) { T().signal = arg; save(true); fx('tick'); render(); },
    setLang: function (arg) { T().lang = arg; save(true); fx('tick'); render(); },
    full: function (arg) {
      ui.fullKind = arg; openLayer(fullHtml(arg));
      try { var d = document.documentElement; (d.requestFullscreen || d.webkitRequestFullscreen || function () { }).call(d); } catch (e) { }
    },
    cycleFull: function () { cycleFull(); },
    ladder: function (arg) {
      var t = T(), k = Number(arg);
      if (!t.ladder[k] && k > 0 && !t.ladder[k - 1]) { toast('Commence par l’étape ' + k + ' : monte l’échelle une marche à la fois.'); return; }
      if (t.ladder[k]) { for (var j = k; j < 5; j++) t.ladder[j] = false; } else t.ladder[k] = true;
      save(true); render();
    },
    ladderSignal: function (arg) {
      var t = T(), idx = arg === 'teacher' ? 4 : 3;
      for (var j = 0; j < idx; j++) if (!t.ladder[j]) { toast('Essaie d’abord les étapes 1 à ' + idx + '.'); return; }
      t.signal = arg; t.ladder[idx] = true; save(true); fx('tick');
      ui.fullKind = 'help'; openLayer(fullHtml('help'));
    },
    ladderReset: function () { var t = T(); t.ladder = fill(5, false); if (t.signal !== 'ok') t.signal = 'ok'; save(true); render(); toast('Bravo ! Le prisme repasse au vert.'); },
    award: function (arg) {
      askCode(function () {
        var t = T(), b = null; for (var k = 0; k < DATA.badges.length; k++) if (DATA.badges[k].key === arg) b = DATA.badges[k];
        t.badges[arg] = (t.badges[arg] || 0) + 1; save(true); render(); celebrate(b);
      });
    },
    unaward: function (arg) { askCode(function () { var t = T(); t.badges[arg] = Math.max(0, (t.badges[arg] || 0) - 1); save(true); render(); }); },
    key: function (arg) { keyPress(arg); },
    setCode: function () {
      var start = function () { codeMode = 'set'; codeBuf = ''; codeCb = null; openLayer(keypadHtml('Nouveau code (4 chiffres)')); };
      if (store.settings.code) askCode(start); else start();
    },
    clearCode: function () { askCode(function () { store.settings.code = ''; save(true); render(); toast('Code supprimé.'); }); },
    exportTeam: function () { var t = T(); download('team-quest-' + slug(t.name) + '-' + new Date().toISOString().slice(0, 10) + '.json', { kind: 'teamquest-team', v: 3, team: t }); },
    exportAll: function () { download('team-quest-toutes-equipes-' + new Date().toISOString().slice(0, 10) + '.json', { kind: 'teamquest-all', v: 3, teams: store.teams }); },
    newSession: function () {
      modal('Nouvelle séance', '<p>Efface les fiches de la séance (mission, notes, oral, contributions, échelle, chrono) et garde l’équipe, la mission et les badges.</p>', [
        { label: 'Annuler', act: 'closeLayer' }, { label: 'Mêmes rôles', act: 'newSessionGo', arg: 'keep' }, { label: 'Avec rotation des rôles', act: 'newSessionGo', arg: 'rotate', cls: 'go' }]);
    },
    newSessionGo: function (arg) {
      var t = T(), b = blankTeam();
      t.mc = b.mc; t.notes = b.notes; t.talk = b.talk; t.voices = {}; t.ladder = b.ladder; t.jobs = {}; t.signal = 'ok'; t.lang = 'great';
      t.time.running = false; t.time.cur = 0; t.time.left = phaseLen(t, 0); t.time.said = {}; t.time.adjust = ''; t.time.kept = false;
      t.session++; if (arg === 'rotate') rotateRoles(t);
      save(true); closeLayer(); toast('Séance ' + t.session + ' prête !'); go('hub');
    },
    print: function () { window.print(); },
    tab: function (arg) { ui.tab = arg; render(); },
    voiceMember: function (arg) { ui.voiceMember = arg; render(); }
  };

  function openPresent() {
    var t = T(), s = TALK[ui.presentIdx], txt = t.talk[s.k] || '';
    openLayer('<div class="present" role="dialog" aria-modal="true" aria-label="Présentation"><div class="card"><h2>' + s.n + ' · ' + esc(s.en) + '</h2><div class="starter">' + esc(s.st) + '</div><div class="kw">' + (txt ? esc(txt) : '<span style="color:#9aa9c7">(no keywords yet · pas encore de mots-clés)</span>') + '</div></div>' +
      '<div class="nav"><button class="btn big" data-act="presentNav" data-arg="-1"' + (ui.presentIdx === 0 ? ' disabled' : '') + '>' + icon('back') + ' Back</button>' +
      '<button class="btn big" data-act="presentNav" data-arg="close" data-autofocus>' + icon('x') + ' Close</button>' +
      '<button class="btn go big" data-act="presentNav" data-arg="1"' + (ui.presentIdx === TALK.length - 1 ? ' disabled' : '') + '>Next ' + icon('start') + '</button></div>' +
      '<p style="margin-top:14px;font-weight:900">' + (ui.presentIdx + 1) + ' / ' + TALK.length + ' · ' + esc(t.name) + '</p></div>');
  }

  /* ================= EVENTS ================= */
  document.addEventListener('click', function (e) {
    var el = e.target.closest ? e.target.closest('[data-act]') : null;
    if (!el || el.disabled) return;
    var act = el.getAttribute('data-act'), fn = ACT[act];
    if (!fn) return;
    e.preventDefault();
    if (actx && actx.state === 'suspended') try { actx.resume(); } catch (er) { }
    fn(el.getAttribute('data-arg') || '', el);
  });
  document.addEventListener('input', function (e) {
    var el = e.target, path = el.getAttribute && el.getAttribute('data-bind');
    if (!path || el.type === 'checkbox' || el.hasAttribute('data-num') || el.tagName === 'SELECT') return;
    var r = rootFor(path); if (!r.obj) return;
    setPath(r.obj, r.path, el.value); save();
    if (path === 'name') { var c = document.querySelector('.chip-team span'); if (c) c.textContent = el.value; }
  });
  document.addEventListener('change', function (e) {
    var el = e.target;
    if (el.getAttribute && el.getAttribute('data-import')) {
      var f = el.files && el.files[0]; if (!f) return;
      var fr = new FileReader(); fr.onload = function () { importText(String(fr.result)); }; fr.onerror = function () { toast('Lecture du fichier impossible.'); }; fr.readAsText(f);
      el.value = ''; return;
    }
    var path = el.getAttribute && el.getAttribute('data-bind'); if (!path) return;
    var r = rootFor(path); if (!r.obj) return;
    if (el.type === 'checkbox') {
      setPath(r.obj, r.path, el.checked); save(true);
      var lab = el.closest('.check'); if (lab && !lab.classList.contains('mini')) { if (el.checked) lab.classList.add('done'); else lab.classList.remove('done'); }
      if (el.checked && path.indexOf('$') !== 0) fx('tick');
      if (el.hasAttribute('data-rr') || path === '$settings.fr') render();
      return;
    }
    if (el.hasAttribute('data-num')) {
      var n = Number(el.value), mn = Number(el.getAttribute('data-min')), mx = Number(el.getAttribute('data-max'));
      if (isNaN(n)) n = mn; if (el.getAttribute('data-min') !== null) n = Math.max(mn, Math.min(mx, n));
      if (el.tagName !== 'SELECT') n = Math.round(n);
      setPath(r.obj, r.path, n);
      var t = T();
      if (t && path.indexOf('time.phases.') === 0 && !t.time.running) { t.time.left = phaseLen(t, t.time.cur); t.time.said = {}; }
      save(true); render(); return;
    }
    setPath(r.obj, r.path, el.value); save(true);
  });
  document.addEventListener('keydown', function (e) {
    if (!layer.innerHTML) return;
    if (e.key === 'Escape') { closeLayer(); return; }
    if (layer.querySelector('.present')) { if (e.key === 'ArrowRight') ACT.presentNav('1'); if (e.key === 'ArrowLeft') ACT.presentNav('-1'); }
    else if (layer.querySelector('.full') && (e.key === ' ' || e.key === 'ArrowRight') && document.activeElement && !document.activeElement.closest('.close')) { e.preventDefault(); cycleFull(); }
    else if (layer.querySelector('.keypad') && /^[0-9]$/.test(e.key)) keyPress(e.key);
  });
  document.addEventListener('visibilitychange', function () { var t = T(); if (!document.hidden && t && t.time.running) { wake(true); tick(); } });

  /* ================= START ================= */
  load();
  var t0 = T(); if (t0 && t0.time.running) ensureTick();
  render(true);
  window.TEAMQUEST = { store: function () { return store; }, ACT: ACT, go: go };
})();

</script>
</body>
</html>
