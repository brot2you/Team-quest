#234c9a;object-fit:cover;aspect-ratio:1.5;object-position:top left}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}.roles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}.role{border:3px solid #1b478d;border-radius:18px;padding:16px;background:var(--bg);box-shadow:0 5px 0 #1b478d}.role .emoji{font-size:48px}.role h3{margin:5px 0;font-size:21px}.role p{min-height:42px}.role.active{outline:5px solid #ffcb26}.role button{width:100%}.tile{border:3px solid #1b478d;border-radius:17px;padding:16px;background:var(--bg,#e9f6ff);min-height:120px;box-shadow:0 4px 0 #1b478d}.tile h3{margin:0 0 8px}.tile .symbol{font-size:30px}.tile[role=button]{cursor:pointer}.tile[role=button]:hover{transform:translateY(-2px)}.two{display:grid;grid-template-columns:1fr 1fr;gap:15px}.three{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.field{display:flex;flex-direction:column;gap:6px;font-weight:800;margin-bottom:12px}.field input,.field textarea,.field select{width:100%;border:2px solid #83b2e3;border-radius:12px;padding:10px;background:#fff;min-height:43px;color:#17375d}.field textarea{min-height:100px;resize:vertical}.step{display:flex;align-items:center;gap:12px;background:#f2f8ff;border:2px solid #c8e3ff;padding:10px;border-radius:13px;margin:7px 0}.step input{width:22px;height:22px;accent-color:#1ba84a}.small{font-size:13px;color:#46658d}.progress{height:18px;border:2px solid #1b478d;border-radius:12px;background:#e5edff;overflow:hidden}.progress>div{height:100%;background:linear-gradient(90deg,#24cb62,#a3e932);transition:width .2s}.timer{font-size:clamp(55px,9vw,105px);font-weight:1000;letter-spacing:2px;text-align:center;background:#112e67;color:white;border:8px solid #ffc51d;border-radius:22px;padding:15px;margin:14px auto;max-width:480px;font-variant-numeric:tabular-nums}.phases{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.phase{border-radius:12px;padding:12px 5px;text-align:center;font-weight:850;background:var(--bg);border:2px solid #19428b}.phase.active{outline:4px solid #ffbd20}.center{text-align:center}.wheelwrap{display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:30px}.wheel{height:min(70vw,360px);width:min(70vw,360px);border-radius:50%;border:9px solid #17438d;position:relative;background:conic-gradient(#ff6fb3 0 60deg,#ffcb36 60deg 120deg,#32d87d 120deg 180deg,#56d7fb 180deg 240deg,#a995ff 240deg 300deg,#ff9e50 300deg 360deg);display:grid;place-items:center;box-shadow:0 9px 0 #17438d}.wheel:before{content:'▼';position:absolute;top:-28px;color:#143c89;font-size:36px}.wheel button{border-radius:50%;width:105px;height:105px;background:#ffde2b;border:5px solid #16448c;font-weight:1000;color:#12376f;font-size:17px}.phrase{display:flex;align-items:center;gap:12px;justify-content:space-between;border:2px solid #b8d9fa;background:#f2f9ff;padding:12px;border-radius:14px;margin:8px 0}.phrase strong{display:block}.phrase .small{margin-top:4px}.tabs{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:15px}.chip{border:2px solid #1b478d;border-radius:22px;padding:8px 12px;background:#fff;font-weight:800}.chip.active{background:#ffcb2f}.badgegrid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.award{border:4px solid #153e86;border-radius:50%;aspect-ratio:1;display:grid;place-content:center;text-align:center;background:var(--bg);font-weight:1000;font-size:clamp(12px,2vw,19px);box-shadow:0 4px 0 #173c85}.award span{font-size:35px}.muted{opacity:.4;filter:grayscale(1)}.toast{position:fixed;bottom:15px;left:50%;transform:translateX(-50%);background:#153e86;color:#fff;padding:12px 20px;border-radius:14px;font-weight:800;z-index:10}.hide{display:none!important}footer{text-align:center;padding:22px;color:#40618e;font-weight:750}@media(max-width:780px){.grid,.roles{grid-template-columns:repeat(2,1fr)}.hero,.two{grid-template-columns:1fr}.three{grid-template-columns:1fr}.phases{grid-template-columns:repeat(2,1fr)}}@media(max-width:480px){.grid,.roles,.badgegrid{grid-template-columns:1fr 1fr}.app{padding:9px}.inner{padding:12px}.role{padding:10px}.role h3{font-size:17px}.role .emoji{font-size:34px}.btn{padding:9px}.top{padding:10px}.brand{font-size:27px}}@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;transition:none!important}}

body{background:radial-gradient(circle at 15% 10%,#fff8ae 0 3px,transparent 4px),radial-gradient(circle at 75% 30%,#fff 0 3px,transparent 4px),linear-gradient(145deg,#7ee9ff,#d9f8ff 55%,#ffe8a3);background-size:65px 65px,95px 95px,auto}.top{background:linear-gradient(135deg,#8cefff,#fff 65%,#fff5b8);border-width:4px}.panel{border-width:4px}.panelhead{font-size:clamp(19px,2.7vw,28px);letter-spacing:.3px;text-shadow:2px 2px 0 #112f68;background:linear-gradient(100deg,#0877e6,#1341a3)}.btn{transition:transform .1s,filter .1s;box-shadow:0 5px 0 #173b83;background:linear-gradient(#fff,#e8f5ff)}.btn:active{transform:translateY(4px);box-shadow:0 1px 0 #173b83}.btn.green{background:linear-gradient(#a0ff65,#0ac444)}.btn.blue{background:linear-gradient(#b8efff,#37adff)}.btn.pink{background:linear-gradient(#ffc8eb,#ff62b8)}.btn.primary{background:linear-gradient(#fff8a0,#ffc51a)}.hero{background:linear-gradient(145deg,#6fdbff,#c5f9ff 65%,#ffe99c)}.hero h1{color:#ffcb24;-webkit-text-stroke:1.4px #153778;text-shadow:3px 4px 0 #153778,5px 6px 0 white}.hero img{object-fit:contain;aspect-ratio:1.55;background:linear-gradient(#b5f1ff,#fff8ba);image-rendering:auto}.role{position:relative;overflow:hidden;text-align:center;border-width:4px;background:linear-gradient(#fff,var(--bg));min-height:325px}.role-art{display:block;width:min(100%,135px);height:155px;object-fit:contain;object-position:center;margin:2px auto 6px;filter:drop-shadow(2px 4px 1px #4565a555)}.role h3{color:#153b88;text-shadow:1px 2px #fff;font-size:clamp(18px,2.2vw,25px)}.role p{font-size:14px}.tile{background:linear-gradient(135deg,#fff,var(--bg));border-width:4px;transition:transform .15s}.tile:hover{transform:translateY(-3px)}.timer{box-shadow:0 10px 0 #163c83,0 0 0 8px #69baff;background:linear-gradient(#173e85,#091b44)}.setup-shade{position:fixed;inset:0;z-index:100;background:#092859b9;display:grid;place-items:center;padding:16px}.setup-card{width:min(100%,550px);max-height:95vh;overflow:auto;border:5px solid #163e8e;border-radius:26px;background:linear-gradient(145deg,#b7edff,#fff9c6 55%,#ffd2ed);box-shadow:0 12px 0 #102b64;padding:24px}.setup-card h2{margin:0;color:#ffae00;text-shadow:2px 3px #153b80;-webkit-text-stroke:1px #153b80;font-size:clamp(25px,4vw,38px)}.setup-card label{display:block;font-weight:900;margin:16px 0}.setup-card input{width:100%;border:3px solid #17509c;border-radius:12px;padding:12px;margin-top:6px;background:white}.setup-actions{display:flex;justify-content:flex-end;gap:12px;flex-wrap:wrap}.translation[hidden]{display:none!important}.translate-btn{font-size:12px;padding:8px;white-space:nowrap}.phrase{gap:7px}.role.active{outline:5px solid #ffd52b}@media(max-width:480px){.roles{grid-template-columns:1fr 1fr}.role{min-height:290px}.role-art{height:120px}.hero img{width:100%}.phrase{flex-wrap:wrap}.setup-card{padding:16px}}</style></head><body><div class="app"><header class="top"><div><div class="brand">⭐ TEAM <span>QUEST!</span></div><div class="sub">BUILD BETTER TOGETHER! · by brot2you</div></div><nav class="nav"><button class="btn" data-go="home">🏠 Home</button><button class="btn" data-go="roles">👥 Roles</button><button class="btn" data-go="tools">🧰 Tools</button><button class="btn" data-go="settings">⚙️</button></nav></header><main id="view"></main><footer>TEAM QUEST · Tous ensemble, chacun son rôle ! · Sauvegarde locale sur cet appareil</footer></div><script>
const KEY='teamquest-v1';const defaults={sound:true,team:'Équipe des étoiles',mission:'Préparer une présentation en anglais',duration:30,role:'leader',members:['Léa','Tom','Nina','Sam'],checks:{},notes:[],ideas:'',evidence:'',answer:'',reasons:'',conclusion:'',question:'',timePlan:[5,10,10,5],awards:[],contrib:{},turnIndex:-1};let s;try{s={...defaults,...JSON.parse(localStorage.getItem(KEY)||'{}')}}catch{s={...defaults}};let page='home',tab='clarify',timerSeconds=600,timerRunning=false,timerInterval=null,phase=0;const view=document.getElementById('view');const roles=[['leader','👑','Team Leader','Chef d’équipe','J’organise et je guide','#c9f7c6'],['secretary','📝','Secretary','Secrétaire','Je note et je garde une trace','#cdeaff'],['speaker','📣','Spokesperson','Porte-parole','Je présente les idées du groupe','#ffe0ae'],['time','⏱️','Timekeeper','Gardien du temps','Je gère les étapes et le temps','#e6d5ff'],['language','💬','Language Keeper','Gardien de l’anglais','J’aide à parler anglais','#ffd0eb'],['player','🤝','Team Player','Membre de l’équipe','Je participe, j’écoute et j’aide','#c7f4f9']];const tools=[['mission','🎯','Mission Control','Objectifs et étapes','#c7f6c5'],['notes','📝','Team Notes','Idées et preuves','#cceaff'],['talk','📣','Team Talk','Préparer l’oral','#ffdbad'],['timer','⏱️','Our Time','Chronomètre et étapes','#e6d6ff'],['wheel','🎡','Talking Wheel','Répartir la parole','#ffd0eb'],['phrases','💬','Keep Talking','Expressions utiles','#c6f5f7'],['help','🪜','I’m Stuck!','Échelle d’aide','#fff1b6'],['contribution','🌟','My Voice, Our Team','Participation individuelle','#d7f6d0'],['awards','🏆','Well Done!','Félicitations','#ffe3a2']];function save(){localStorage.setItem(KEY,JSON.stringify(s))}function esc(x){return String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function go(p){page=p;render();scrollTo({top:0,behavior:'smooth'})}function panel(title,html){return `<section class="panel"><div class="panelhead">${title}</div><div class="inner">${html}</div></section>`}function btn(t,fn,cls='primary'){return `<button class="btn ${cls}" onclick="${fn}">${t}</button>`}function field(label,key,multi=false){return `<label class="field">${label}${multi?`<textarea data-field="${key}">${esc(s[key])}</textarea>`:`<input data-field="${key}" value="${esc(s[key])}">`}</label>`}function card(t,fn){return `<div class="tile" style="--bg:${t[4]}" role="button" tabindex="0" onclick="go('${fn}')" onkeydown="if(event.key==='Enter')go('${fn}')"><div class="symbol">${t[1]}</div><h3>${t[2]}</h3><div>${t[3]}</div></div>`}function home(){return panel('🌈 WELCOME TO TEAM QUEST!',`<div class="hero inner"><div><h1>ONE TEAM.<br>SIX ROLES.<br>ONE MISSION!</h1><p>Work together, speak English, and complete your mission!</p>${btn('🚀 LET’S GO!',"go('roles')",'green')} ${btn('🎯 Our mission',"go('mission')")}</div><img src="assets/hero-characters.png" alt="Team Quest characters"></div>`)+panel('🧱 OUR TOOLS',`<div class="grid">${tools.map(t=>card(t,t[0])).join('')}</div>`)}function rolePage(){return panel('👥 CHOOSE YOUR TEAM ROLE',`<div class="roles">${roles.map(r=>`<article class="role ${s.role===r[0]?'active':''}" style="--bg:${r[5]}"><img class="role-art" src="assets/${r[0]}.png" alt="${r[2]} character"><h3>${r[2]}</h3><b>${r[3]}</b><p>${r[4]}</p>${btn(s.role===r[0]?'✓ My role':'Choose',`chooseRole('${r[0]}')`,'green')}</article>`).join('')}</div>`)+panel('🎒 MY TOOLS',`<div class="grid">${tools.filter(t=>({leader:['mission','wheel','help'],secretary:['notes','mission','phrases'],speaker:['talk','phrases','notes'],time:['timer','mission','wheel'],language:['phrases','help','wheel'],player:['contribution','help','phrases']}[s.role]).includes(t[0])).map(t=>card(t,t[0])).join('')}</div>`)}function chooseRole(r){s.role=r;save();render()}function toolPage(){return panel('🧰 OUR TOOLBOX',`<div class="grid">${tools.map(t=>card(t,t[0])).join('')}</div>`)}const checks=['Nous avons compris la consigne.','Chacun connaît sa tâche.','Tout le monde participe.','Nous avons vérifié notre travail.','Nous pouvons expliquer notre réponse.','Notre production est prête.'];function mission(){let done=checks.filter((_,i)=>s.checks['mission'+i]).length;return panel('🎯 MISSION CONTROL · Notre tableau de bord',`${field('Team name','team')}${field('Notre objectif / Our goal','mission')}<p><b>Progression de la mission : ${done}/${checks.length}</b></p><div class="progress"><div style="width:${done/checks.length*100}%"></div></div><h3>🧩 Les étapes</h3><div class="phases">${['🔍 Explorer','💬 Discuter','🛠️ Créer','✅ Vérifier'].map((v,i)=>`<div class="phase" style="--bg:${['#bcf2c4','#b9eaff','#ffe4a7','#ffc8e9'][i]}">${i+1}. ${v}</div>`).join('')}</div><h3>🏁 Success checklist</h3>${checks.map((c,i)=>`<label class="step"><input type="checkbox" data-check="mission${i}" ${s.checks['mission'+i]?'checked':''}>${c}</label>`).join('')}${btn('📝 Prendre des notes',"go('notes')")}`)}function notes(){return panel('📝 TEAM NOTES · La synthèse de nos décisions',`<div class="two">${field('💡 Nos idées / Our ideas','ideas',true)}${field('🔎 Preuves, exemples ou indices / Evidence','evidence',true)}${field('✍️ Notre réponse commune / Our final answer','answer',true)}${field('❓ Points à vérifier / Questions','question',true)}</div><h3>📌 Notes rapides</h3><div class="two"><label class="field">Nouvelle note<input id="quicknote" placeholder="Une idée, une décision, une question..."></label><div style="align-self:end">${btn('＋ Ajouter', 'addNote()','blue')}</div></div>${s.notes.map((n,i)=>`<div class="step"><span style="flex:1">${esc(n)}</span>${btn('✕',`removeNote(${i})`)}</div>`).join('')}${btn('📣 Préparer la restitution',"go('talk')")}`)}function addNote(){let v=document.getElementById('quicknote').value.trim();if(v){s.notes.push(v);save();render()}}function removeNote(i){s.notes.splice(i,1);save();render()}function talk(){return panel('📣 TEAM TALK · Notre restitution orale',`<p class="small">KEYWORDS ONLY! Utilise des mots-clés pour parler sans lire un discours complet.</p><div class="two">${field('01 · Our answer / Notre réponse','answer',true)}${field('02 · Our evidence / Nos preuves','evidence',true)}${field('03 · Our reasons / Nos raisons','reasons',true)}${field('04 · Our conclusion / Notre conclusion','conclusion',true)}</div><h3>🎤 Ready to speak?</h3>${['Nous sommes d’accord sur notre réponse.','Je me suis entraîné avec mon équipe.','Je regarde mon public et je parle clairement.'].map((c,i)=>`<label class="step"><input type="checkbox" data-check="talk${i}" ${s.checks['talk'+i]?'checked':''}>${c}</label>`).join('')}<p>${btn('💬 Phrases pour répondre',"go('phrases')",'pink')}</p>`)}function timefmt(n){return `${String(Math.floor(n/60)).padStart(2,'0')}:${String(n%60).padStart(2,'0')}`}function timer(){return panel('⏱️ TIME TO TEAM UP! · Notre frise de travail',`<div class="phases">${['🔍 Explorer','💬 Discuter','🛠️ Créer','✅ Vérifier'].map((v,i)=>`<button class="phase ${phase===i?'active':''}" style="--bg:${['#b9f4bd','#a9e5ff','#ffe29b','#ffc3e1'][i]}" onclick="setPhase(${i})">${v}<br><b>${s.timePlan[i]} min</b></button>`).join('')}</div><div class="timer" id="clock">${timefmt(timerSeconds)}</div><div class="center">${btn(timerRunning?'⏸ Pause':'▶ Démarrer','toggleTimer()','green')} ${btn('↺ Réinitialiser','resetTimer()','blue')} ${btn('＋1 min','adjustTime(60)')} ${btn('−1 min','adjustTime(-60)')}</div><p class="small center">Le minuteur fonctionne tant que cette page reste ouverte. Une alerte sonore signale la fin du temps.</p><h3>🕐 Répartition du temps (minutes)</h3><div class="phases">${s.timePlan.map((v,i)=>`<label class="field">Étape ${i+1}<input type="number" min="1" max="120" value="${v}" onchange="updatePhase(${i},this.value)"></label>`).join('')}</div>`)}function setPhase(i){phase=i;timerRunning=false;clearInterval(timerInterval);timerSeconds=s.timePlan[i]*60;render()}function updatePhase(i,v){s.timePlan[i]=Math.max(1,Math.min(120,Number(v)||1));save();setPhase(i)}function toggleTimer(){timerRunning=!timerRunning;if(timerRunning){timerInterval=setInterval(()=>{timerSeconds=Math.max(0,timerSeconds-1);let el=document.getElementById('clock');if(el)el.textContent=timefmt(timerSeconds);if(timerSeconds===0){timerRunning=false;clearInterval(timerInterval);try{let a=new (window.AudioContext||window.webkitAudioContext)(),o=a.createOscillator(),g=a.createGain();o.connect(g);g.connect(a.destination);o.frequency.value=660;g.gain.value=.1;o.start();o.stop(a.currentTime+.25)}catch{}toast('⏰ Time’s up!')}} ,1000)}else clearInterval(timerInterval);render()}function resetTimer(){timerRunning=false;clearInterval(timerInterval);timerSeconds=s.timePlan[phase]*60;render()}function adjustTime(v){timerSeconds=Math.max(0,timerSeconds+v);render()}function wheel(){return panel('🎡 OUR TALKING WHEEL · Notre roue de parole',`<div class="wheelwrap"><div class="wheel"><button onclick="spin()">▶<br>TOURNE !</button></div><div><h2 id="selected">${s.turnIndex<0?'À qui le tour ?':`C’est à ${esc(s.members[s.turnIndex])} !`}</h2><p>Donne la parole à chaque membre de l’équipe.</p>${btn('🎲 Tirer au hasard','spin()','pink')} ${btn('➡️ Tour suivant','nextTurn()','blue')}<p class="small">It's your turn! What do you think?</p></div></div><h3>👥 Membres de l’équipe</h3>${s.members.map((m,i)=>`<label class="field">Élève ${i+1}<input value="${esc(m)}" onchange="changeMember(${i},this.value)"></label>`).join('')}${btn('＋ Ajouter un membre','addMember()')}`)}function spin(){if(!s.members.length)return;s.turnIndex=Math.floor(Math.random()*s.members.length);save();render()}function nextTurn(){if(!s.members.length)return;s.turnIndex=(s.turnIndex+1)%s.members.length;save();render()}function changeMember(i,v){s.members[i]=v;save()}function addMember(){if(s.members.length>=12)return toast('Maximum 12 membres');s.members.push('Élève '+(s.members.length+1));save();render()}const phrases={clarify:[['Can you repeat, please?','Peux-tu répéter, s’il te plaît ?'],['Can you speak more slowly, please?','Peux-tu parler plus lentement ?'],['What does this word mean?','Que signifie ce mot ?'],['Can you give an example?','Peux-tu donner un exemple ?']],rephrase:[['Do you mean…?','Veux-tu dire… ?'],['So, you think that…','Donc, tu penses que…'],['In other words…','Autrement dit…'],['Let me try again.','Je vais essayer de le dire autrement.']],disagree:[['I see your point, but…','Je comprends ton point de vue, mais…'],['I’m not sure I agree.','Je ne suis pas sûr d’être d’accord.'],['I think… because…','Je pense… parce que…'],['What if we…?','Et si nous… ?']],describe:[["It’s a kind of…","C’est une sorte de…"],["You use it to…","On l’utilise pour…"],["It’s like… but…","C’est comme… mais…"],["It’s a person who…","C’est une personne qui…"]],team:[['What do you think?','Qu’en penses-tu ?'],['I agree. / I disagree.','Je suis d’accord. / Je ne suis pas d’accord.'],['Can you help me?','Peux-tu m’aider ?'],["Let’s try in English!","Essayons en anglais !"],['Let’s ask the teacher.','Demandons au professeur.']]};function phrasePage(){let tabs=[['clarify','Ask'],['rephrase','Rephrase'],['disagree','Opinions'],['describe','Describe'],['team','Team talk']];return panel('💬 KEEP TALKING! · LANGUAGE TOOLBOX',`<div class="tabs">${tabs.map(t=>`<button class="chip ${tab===t[0]?'active':''}" onclick="tab='${t[0]}';render()">${t[1]}</button>`).join('')}</div>${phrases[tab].map(([en,fr])=>`<div class="phrase"><div><strong>${esc(en)}</strong><div class="small translation" hidden>${esc(fr)}</div></div>${btn('🔊 Listen',`speak(${JSON.stringify(en).replace(/"/g,'&quot;')})`,'blue')} <button class="btn translate-btn" onclick="toggleTranslation(this)" aria-label="Show French translation">🇫🇷 FR</button></div>`).join('')}<p class="small">Tap Listen to hear English. Tap FR only when you need help.</p>`)}function speak(t){if(!('speechSynthesis'in window))return toast('Audio indisponible');speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(t);u.lang='en-GB';u.rate=.83;speechSynthesis.speak(u)}const helpSteps=[['1','Je relis la consigne.','Think again'],['2','Je consulte la boîte à phrases ou mes outils.','Check the toolbox'],['3','Je demande à mon équipe.','Ask your team'],['4','Je demande à un autre groupe.','Ask another group'],['5','Je demande au professeur.','Ask the teacher']];function help(){return panel('🪜 I’M STUCK! · Mon échelle d’aide',`<p>Commence à l’étape 1. Coche chaque étape essayée avant de demander de l’aide.</p>${helpSteps.map(([n,fr,en],i)=>`<label class="step" style="background:${['#c8f9cb','#c7eaff','#fff2b5','#ffdfb7','#ffd1db'][i]}"><input type="checkbox" data-check="help${i}" ${s.checks['help'+i]?'checked':''}><div><b>${n}. ${fr}</b><div class="small">${en}</div></div></label>`).join('')}<p>${btn('💬 Ouvrir les phrases utiles',"go('phrases')",'pink')}</p>`)}function contribution(){return panel('🌟 MY VOICE, OUR TEAM · Ma contribution',`<h3>Avant l’échange</h3><div class="two">${field('💡 Mon idée','contribIdea',true)}${field('🔎 Ma preuve ou mon exemple','contribEvidence',true)}</div>${field('❓ Ma question','contribQuestion',true)}<h3>Après notre échange</h3><div class="two">${field('➕ Ce que j’ai ajouté','contribAdded',true)}${field('🔁 Ce que j’ai changé','contribChanged',true)}</div><h3>Ma participation</h3>${['J’ai partagé une idée.','J’ai écouté les autres.','J’ai aidé mon équipe.'].map((x,i)=>`<label class="step"><input type="checkbox" data-check="contrib${i}" ${s.checks['contrib'+i]?'checked':''}>${x}</label>`).join('')}`)}const awardNames=[['🌟','WELL DONE!','#ffde58'],['💡','GREAT IDEA!','#ffcb6b'],['🤝','GOOD TEAMWORK!','#72d9ff'],['📣','KEEP SPEAKING!','#ff91cd'],['🇬🇧','GREAT ENGLISH!','#83f17e'],['🏆','GREAT EFFORT!','#d9b2ff']];function awards(){return panel('🏆 NOS FÉLICITATIONS !',`<p>Choisissez ensemble une récompense qui reflète les efforts du groupe. Les badges sont enregistrés sur cet appareil.</p><div class="badgegrid">${awardNames.map((a,i)=>`<button class="award ${s.awards.includes(i)?'':'muted'}" style="--bg:${a[2]}" onclick="toggleAward(${i})"><span>${a[0]}</span>${a[1]}<small>${s.awards.includes(i)?'✓ Gagné':'À débloquer'}</small></button>`).join('')}</div><p class="center">⭐ ${s.awards.length} / ${awardNames.length} badges</p>`)}function toggleAward(i){s.awards=s.awards.includes(i)?s.awards.filter(x=>x!==i):[...s.awards,i];save();render()}function settings(){return panel('⚙️ SETUP & SAVE',`${field('Team name','team')}${field('Mission','mission')}<label class="step"><input type="checkbox" id="sound-setting" ${s.sound!==false?'checked':''} onchange="s.sound=this.checked;save()">🔊 Sound effects / Effets sonores</label><p class="small">SETUP: 1. Name your team. 2. Write your mission. 3. Add members in Talking Wheel. 4. Choose roles. 5. Start the mission.</p><p>Les données restent dans le navigateur. Pour changer d’appareil ou partager la production, exportez un fichier.</p><div class="nav">${btn('📤 Exporter les données','exportData()','green')}<label class="btn blue">📥 Importer un fichier<input type="file" accept=".json,application/json" onchange="importData(this.files[0])" style="display:none"></label>${btn('🖨️ Imprimer le bilan','printSummary()')}${btn('🗑️ Réinitialiser','clearData()','pink')}</div>`)}function exportData(){let b=new Blob([JSON.stringify(s,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='team-quest-'+new Date().toISOString().slice(0,10)+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}async function importData(f){if(!f)return;try{let v=JSON.parse(await f.text());if(!v||typeof v!=='object'||Array.isArray(v))throw Error();s={...defaults,...v};save();render();toast('Import réussi')}catch{toast('Fichier non valide')}}function clearData(){if(confirm('Effacer les données de cette équipe sur cet appareil ?')){s=structuredClone(defaults);save();go('home')}}function printSummary(){let w=window.open('','_blank');if(!w)return toast('Autorise les fenêtres pour imprimer');let e=esc;w.document.write(`<html><meta charset="utf-8"><title>Bilan TEAM QUEST</title><body style="font-family:Arial;line-height:1.6;padding:30px"><h1>TEAM QUEST — ${e(s.team)}</h1><h2>Mission</h2><p>${e(s.mission)}</p><h2>Idées</h2><p>${e(s.ideas)}</p><h2>Preuves</h2><p>${e(s.evidence)}</p><h2>Réponse</h2><p>${e(s.answer)}</p><h2>Raisons</h2><p>${e(s.reasons)}</p><h2>Conclusion</h2><p>${e(s.conclusion)}</p><h2>Notes</h2><ul>${s.notes.map(n=>`<li>${e(n)}</li>`).join('')}</ul></body></html>`);w.document.close();w.print()}function toast(m){let x=document.createElement('div');x.className='toast';x.textContent=m;document.body.append(x);setTimeout(()=>x.remove(),2500)}function render(){view.innerHTML=({home,roles:rolePage,tools:toolPage,mission,notes,talk,timer,wheel,phrases:phrasePage,help,contribution,awards,settings}[page]||home)();view.querySelectorAll('[data-field]').forEach(el=>{let k=el.dataset.field; if(k.startsWith('contrib'))el.value=s.contrib[k]||'';el.addEventListener('input',()=>{if(k.startsWith('contrib'))s.contrib[k]=el.value;else s[k]=el.value;save()})});view.querySelectorAll('[data-check]').forEach(el=>el.addEventListener('change',()=>{s.checks[el.dataset.check]=el.checked;save();if(page==='mission')render()}))}let audioCtx;function fx(kind='click'){if(s.sound===false)return;try{audioCtx=audioCtx||new (window.AudioContext||window.webkitAudioContext)();const a=audioCtx,t=a.currentTime,o=a.createOscillator(),g=a.createGain();o.type=kind==='win'?'triangle':'sine';o.frequency.setValueAtTime(kind==='win'?520:kind==='spin'?300:650,t);o.frequency.exponentialRampToValueAtTime(kind==='win'?880:kind==='spin'?520:440,t+.11);g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.055,t+.01);g.gain.exponentialRampToValueAtTime(.0001,t+.16);o.connect(g);g.connect(a.destination);o.start(t);o.stop(t+.17)}catch{}}document.addEventListener('click',e=>{if(e.target.closest('button,.tile,[role=button]'))fx(e.target.closest('.wheel')?'spin':e.target.closest('.award')?'win':'click')});function toggleTranslation(b){let t=b.closest('.phrase').querySelector('.translation');t.hidden=!t.hidden;b.setAttribute('aria-pressed',String(!t.hidden))}
const originalGo=go;go=function(p){originalGo(p);if(p==='home'&&!localStorage.getItem('teamquest-onboarded'))showSetup()};function showSetup(){if(document.getElementById('setup-dialog'))return;let d=document.createElement('div');d.className='setup-shade';d.id='setup-dialog';d.innerHTML=`<div class="setup-card" role="dialog" aria-modal="true" aria-label="Team setup"><h2>🚀 SET UP YOUR TEAM!</h2><p>Ready in 3 steps · Prêt en 3 étapes</p><label>1 · Team name<input id="setup-team" value="${esc(s.team)}"></label><label>2 · Our mission<input id="setup-mission" value="${esc(s.mission)}"></label><label>3 · Team members <small>(separate names with commas)</small><input id="setup-members" value="${esc(s.members.join(', '))}"></label><div class="setup-actions"><button class="btn blue" id="setup-later">Later</button><button class="btn green" id="setup-start">SAVE & START ▶</button></div></div>`;document.body.append(d);d.querySelector('#setup-later').onclick=()=>{localStorage.setItem('teamquest-onboarded','1');d.remove()};d.querySelector('#setup-start').onclick=()=>{s.team=d.querySelector('#setup-team').value.trim()||s.team;s.mission=d.querySelector('#setup-mission').value.trim()||s.mission;s.members=d.querySelector('#setup-members').value.split(',').map(x=>x.trim()).filter(Boolean).slice(0,12);save();localStorage.setItem('teamquest-onboarded','1');d.remove();go('roles')}}
const englishLabels={'Notre mission':'Our mission','Les étapes':'Our steps','Nos idées':'Our ideas','Nos arguments':'Our arguments','Notre plan':'Our plan','Notre réponse':'Our answer','Nos preuves':'Our evidence','Nos raisons':'Our reasons','Notre conclusion':'Our conclusion','Prendre des notes':'Take notes','Ajouter':'Add','Réinitialiser':'Reset','Démarrer':'Start','Pause':'Pause','Choisir':'Choose','Notre boîte à outils':'Our toolbox','Membres de l’équipe':'Team members','Élève':'Student','Tirer au hasard':'Pick randomly','Tour suivant':'Next turn','À qui le tour ?':'Whose turn?','Je suis bloqué':'I’m stuck','Nos félicitations':'Our rewards','Félicitations':'Rewards','Imprimer le bilan':'Print summary','Exporter les données':'Export data','Importer un fichier':'Import file','Notre objectif':'Our goal','Progression de la mission':'Mission progress','Nouvelle note':'New note','Préparer la restitution':'Prepare your presentation','Vérifier':'Check','Discuter':'Discuss','Créer':'Create','Explorer':'Explore','Comprendre':'Understand','Chercher':'Find ideas','Préparer':'Prepare','S’entraîner':'Practise','Terminé':'Done','Je relis la consigne.':'Read the instructions again.','Je consulte la boîte à phrases ou mes outils.':'Check the toolbox.','Je demande à mon équipe.':'Ask your team.','Je demande à un autre groupe.':'Ask another group.','Je demande au professeur.':'Ask the teacher.'};const baseRender=render;render=function(){baseRender();const walker=document.createTreeWalker(view,NodeFilter.SHOW_TEXT);let n;while(n=walker.nextNode()){if(n.parentElement?.closest('script,style'))continue;let v=n.nodeValue;for(const [fr,en] of Object.entries(englishLabels))v=v.replaceAll(fr,en);if(v!==n.nodeValue)n.nodeValue=v}};
document.querySelectorAll('[data-go]').forEach(el=>el.onclick=()=>go(el.dataset.go));render();if(!localStorage.getItem('teamquest-onboarded'))showSetup();
</script></body></html>
